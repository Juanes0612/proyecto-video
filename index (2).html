<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Video</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      width: 100%;
      background-color: #1e293b;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      color: #38bdf8;
    }

    p {
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .video-container {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background-color: #000;
    }

    video {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>¡Mira este video!</h1>
    <p>Haz clic en el botón de reproducir para iniciar el video.</p>

    <div class="video-container">
      <!-- Asegúrate de que src="video.mp4" coincida exactamente con el nombre de tu archivo -->
      <video controls preload="metadata">
        <source src="video.mp4" type="video/mp4">
        Tu navegador no soporta este reproductor de video.
      </video>
    </div>
  </div>

</body>
</html>
