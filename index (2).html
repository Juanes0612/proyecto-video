<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Un Mensaje Especial ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, #450a0a 0%, #0f172a 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 16px;
    }

    .header {
      text-align: center;
      margin-top: 6px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fecdd3;
      text-shadow: 0 2px 10px rgba(225, 29, 72, 0.5);
    }

    p {
      color: #fda4af;
      font-size: 0.88rem;
      margin-top: 2px;
    }

    .video-container {
      width: 100%;
      max-width: 430px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(225, 29, 72, 0.25), 0 0 20px rgba(0,0,0,0.8);
      border: 1px solid rgba(251, 113, 133, 0.3);
      background-color: #000;
    }

    video {
      width: 100%;
      height: 100%;
      max-height: 78vh;
      /* Mantiene la proporción original del video sin recortar nada */
      object-fit: contain;
      display: block;
    }

    .footer {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #f43f5e;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1> Mira este video❤️</h1>
    <p>Haz clic para reproducir</p>
  </div>

  <div class="video-container">
    <video controls playsinline preload="metadata">
      <source src="video.mp4" type="video/mp4">
      Tu navegador no soporta la reproducción de video.
    </video>
  </div>

  <div class="footer">
     Te amo infinitamente mi niña preciosa✨
  </div>

</body>
</html>
